[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "qubitlens"
version = "0.1.0"
description = "An interactive quantum circuit analysis and visualization tool built with Qiskit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"

authors = [
    { name = "KAMI-D-KAI" }
]

dependencies = [
    "numpy>=2.0,<3.0",
    "qiskit>=2.0,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"