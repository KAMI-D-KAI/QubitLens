[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "qubitlens"
version = "0.1.0"
description = "An interactive quantum circuit analysis and visualization tool built with Qiskit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"

authors = [
    { name = "KAMI-D-KAI" }
]

dependencies = [
    "numpy>=2.0,<3.0",
    "qiskit>=2.0,<3.0",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that verify QubitLens behavior against external integrations such as Qiskit",
]

[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
files = ["src/qubitlens"]
warn_return_any = true
warn_unused_configs = true
show_error_codes = true